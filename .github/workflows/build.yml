name: build-gba

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: compilar
        run: make
      - name: subir o .gba compilado
        uses: actions/upload-artifact@v4
        with:
          name: drawabattle-gba
          path: drawabattle.gba
